[package]
name = "light-json-schema"
version = "1.0.0"
edition = "2024"
description = "A strictly no_std JSON Schema validator for embedded and lightweight async systems"
license = "MIT"
repository = "https://github.com/jblestang/json-schema"
keywords = ["json-schema", "no_std", "validation", "json"]
categories = ["no-std", "parser-implementations"]

[dependencies]
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
regex = { version = "1.13.1", default-features = false }
url = { version = "2.5.8", default-features = false }
iso8601 = { version = "0.6.1", default-features = false }
once_cell = { version = "1.21.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "stress_test"
harness = false
